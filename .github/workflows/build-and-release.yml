# 构建与发布：
# - 推送 v* tag：构建 DeepSeekHarnessBox.exe 并创建 GitHub Release（含版本号、校验和）
# - workflow_dispatch：手动触发构建（不发布 Release）
#
# 构建需要 Node.js + DeepSeek Harness（DSH）来生成内嵌 payload：
# - setup-node 安装 Node.js 24
# - npm 全局安装 @deepseek-ai/dsh（公共包，构建时会被打包进 DeepSeekHarnessBox.exe）
name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 拉取完整历史，保证 git describe 能找到 tag，
          # 否则 main 分支构建的版本号会退化为裸 commit hash。
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 DeepSeek Harness (DSH)
        shell: pwsh
        run: |
          # 内测版固定到当前验证过的 rc 版本，升级时同步修改这里。
          npm install -g @deepseek-ai/dsh@0.1.0-rc.6

      - name: 读取 DSH 版本
        id: dsh
        shell: pwsh
        run: |
          $pkg = "$(npm root -g)\@deepseek-ai\dsh\package.json"
          $dsh = (Get-Content $pkg -Raw | ConvertFrom-Json).version
          "dsh-version=$dsh" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "dsh-version=$dsh"

      - name: 计算版本号
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = git describe --tags --always --dirty
          }
          if (-not $version) { $version = 'dev' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version=$version"

      - name: 构建 DeepSeekHarnessBox.exe
        shell: cmd
        env:
          DEEPSEEKHARNESSBOX_VERSION: ${{ steps.version.outputs.version }}
        run: build.cmd

      - name: 生成 SHA256 校验和
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 .\DeepSeekHarnessBox.exe).Hash.ToLower()
          "DeepSeekHarnessBox.exe  $hash" | Out-File -FilePath "DeepSeekHarnessBox-${{ steps.version.outputs.version }}.sha256" -Encoding ascii

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarnessBox-${{ steps.version.outputs.version }}
          path: |
            DeepSeekHarnessBox.exe
            DeepSeekHarnessBox-*.sha256

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DeepSeekHarnessBox.exe
            DeepSeekHarnessBox-*.sha256
          generate_release_notes: true
          append_body: true
          body: |
            > 内置运行环境：Node.js 24，DSH ${{ steps.dsh.outputs.dsh-version }}
